# ~/.tmux.conf - kept as a fallback while migrating to zellij.
# Sensible modern defaults; Ctrl-b prefix (same as zellij's tmux mode above).

# --- General ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor
set -g mouse on
set -g history-limit 50000
set -g base-index 1                          # windows start at 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0                         # no delay for ESC (vim)
set -g focus-events on

# --- Splits: keep tmux muscle memory ---------------------------------------
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Vim-style pane navigation ---------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Reload config ----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Copy mode (vi) ---------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar (minimal, matches the dark theme) --------------------------
set -g status-style "bg=default fg=white"
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M "
set -g status-justify centre
setw -g window-status-current-style "fg=magenta bold"
